<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Off the Clock · Minji Park</title>
  <meta name="description" content="A few things I do when I'm not designing or building.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,900;1,9..144,600;1,9..144,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ambient floating shapes -->
  <div class="bg-field" id="bgField" aria-hidden="true">
    <span class="bg-shape bg-shape--tri bg-shape--coral" data-depth="0.4" style="--x:6%; --y:16%;"></span>
    <span class="bg-shape bg-shape--circle bg-shape--lime" data-depth="0.22" style="--x:90%; --y:10%;"></span>
    <span class="bg-shape bg-shape--dash bg-shape--violet" data-depth="0.5" style="--x:14%; --y:66%;"></span>
    <span class="bg-shape bg-shape--plus bg-shape--coral" data-depth="0.3" style="--x:93%; --y:60%;"></span>
    <span class="bg-shape bg-shape--circle bg-shape--violet" data-depth="0.16" style="--x:48%; --y:88%;"></span>
    <span class="bg-shape bg-shape--tri bg-shape--lime" data-depth="0.35" style="--x:72%; --y:36%;"></span>
    <span class="bg-shape bg-shape--dash bg-shape--coral" data-depth="0.2" style="--x:34%; --y:6%;"></span>
    <span class="bg-shape bg-shape--plus bg-shape--violet" data-depth="0.28" style="--x:4%; --y:92%;"></span>
  </div>

  <!-- grain overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- ============ NAV ============ -->
  <header class="nav">
    <div class="nav__left">
      <a href="index.html" class="nav__mark" id="navMark" aria-label="Open menu" aria-expanded="false"
        aria-controls="mobileDrawer">
        MJ<span class="dot">.</span>
      </a>
      <nav class="nav__links">
        <a href="index.html#background"><span class="nav__label">Background</span></a>
        <a href="index.html#work"><span class="nav__label">Work</span></a>
        <a href="index.html#experience"><span class="nav__label">Experience</span></a>
        <a href="index.html#skills"><span class="nav__label">Skills</span></a>
        <a href="hobbies.html"><span class="nav__label">Hobbies</span></a>
        <a href="index.html#contact"><span class="nav__label">Contact</span></a>
      </nav>
    </div>
    <a href="index.html#contact" class="nav__cta">Let's talk →</a>
  </header>

  <!-- ============ MOBILE DRAWER ============ -->
  <div class="mobile-drawer__overlay" id="mobileDrawerOverlay"></div>
  <div class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
    <button class="mobile-drawer__close" id="mobileDrawerClose" aria-label="Close menu">✕</button>
    <nav class="mobile-drawer__links">
      <a href="index.html#background">Background</a>
      <a href="index.html#work">Work</a>
      <a href="index.html#experience">Experience</a>
      <a href="index.html#skills">Skills</a>
      <a href="hobbies.html">Hobbies</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <a href="index.html#contact" class="mobile-drawer__cta">Let's talk →</a>
  </div>

  <!-- ============ HOBBIES ============ -->
  <section class="hobbies-page reveal is-visible">
    <a href="index.html" class="project-detail__back">← Back to site</a>

    <div class="section-head">
      <span class="section-head__num">05</span>
      <h2 class="section-head__title">Off the&nbsp;Clock</h2>
      <p class="section-head__note">Hover a photo →</p>
    </div>

    <div class="hobby-collage" id="hobbyCollage">

      <!-- tiles hug the outer edges/corners of the frame,
           leaving the center open — a bento-style scattered
           border rather than a filled block. -->

      <div class="hobby-tile hobby-tile--tall" style="--x:0%; --y:0px; --w:clamp(230px,24vw,340px);">
        <button type="button" class="hobby-card__btn" data-title="Running"
          data-caption="Chasing a slow, unbothered 5K most mornings — it's when I do my best thinking.">
          <span class="hobby-card__btn__frame">
            <img src="images/hobby-1.svg" alt="Running — placeholder, replace with your own photo">
          </span>
          <span class="hobby-card__label">Running</span>
        </button>
      </div>

      <div class="hobby-tile hobby-tile--text" style="--x:2%; --y:400px; --w:clamp(120px,12vw,160px);">
        <div class="sticker sticker--tape">Off Duty</div>
      </div>

      <div class="hobby-tile hobby-tile--lg" style="--x:6%; --y:520px; --w:clamp(260px,26vw,380px);">
        <button type="button" class="hobby-card__btn" data-title="Coloring &amp; Drawing"
          data-caption="No brief, no client, no undo button — just color for the sake of it.">
          <span class="hobby-card__btn__frame">
            <img src="images/hobby-4.svg" alt="Coloring and drawing — placeholder, replace with your own photo">
          </span>
          <span class="hobby-card__label">Coloring &amp; Drawing</span>
        </button>
      </div>

      <div class="hobby-tile hobby-tile--square" style="--x:70%; --y:-10px; --w:clamp(200px,20vw,280px);">
        <button type="button" class="hobby-card__btn" data-title="Coffee &amp; Friends"
          data-caption="Most of my best ideas get bounced around over coffee before they ever touch a screen.">
          <span class="hobby-card__btn__frame">
            <img src="images/hobby-2.svg" alt="Coffee and friends — placeholder, replace with your own photo">
          </span>
          <span class="hobby-card__label">Coffee &amp; Friends</span>
        </button>
      </div>

      <div class="hobby-tile hobby-tile--text" style="--x:58%; --y:60px; --w:clamp(110px,10vw,140px);">
        <div class="sticker sticker--circle">For fun<br>↗</div>
      </div>

      <div class="hobby-tile hobby-tile--wide" style="--x:68%; --y:470px; --w:clamp(260px,27vw,390px);">
        <button type="button" class="hobby-card__btn" data-title="Photography"
          data-caption="Mostly street shots and bad light — same instinct as design, just slower and quieter.">
          <span class="hobby-card__btn__frame">
            <img src="images/hobby-3.svg" alt="Photography — placeholder, replace with your own photo">
          </span>
          <span class="hobby-card__label">Photography</span>
        </button>
      </div>

      <!-- duplicate a "hobby-tile" block above to add another photo.
           Size variants: hobby-tile--tall, hobby-tile--square,
           hobby-tile--wide, hobby-tile--lg, hobby-tile--text (for
           sticker/text cards). Position freely with inline --x/--y
           (top-left offset within the full-bleed collage) and --w
           (tile width) — no grid track to line up with, so gaps and
           sizes can stay irregular like a real moodboard. Keep the
           img wrapped in a "hobby-card__btn__frame" span — that's
           what crops the zoom-on-hover without also clipping the
           button's own hover shadow. -->

    </div>
  </section>

  <footer class="footer">
    <div class="marquee-line marquee-line--reverse marquee-line--violet" aria-hidden="true"></div>
    <a href="index.html#top" class="footer__top">Back to top ↑</a>
    <p class="footer__copy">© <span id="year"></span> Minji Park. All rights reserved.</p>
  </footer>

  <!-- ============ HOBBY LIGHTBOX ============ -->
  <div class="lightbox" id="hobbyLightbox" aria-hidden="true">
    <div class="lightbox__backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox__panel" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
      <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Close">✕</button>
      <h3 class="lightbox__title" id="lightboxTitle"></h3>
      <p class="lightbox__caption" id="lightboxCaption"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
